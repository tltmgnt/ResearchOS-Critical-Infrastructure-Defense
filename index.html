<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1420">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ResearchOS | Critical Infrastructure Defense</title>

<body>
  <div class="app-shell">

      <div class="brand"><span class="brand-mark" aria-hidden="true">◈</span><div><strong>ResearchOS</strong><small>CRITICAL SYSTEMS LAB</small></div></div>
      <div class="work-label">RESEARCH WORKSPACE <span>v1.0</span></div>
