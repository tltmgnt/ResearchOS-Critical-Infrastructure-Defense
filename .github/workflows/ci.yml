name: ResearchOS-CID checks
on:
  push:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node cli.mjs examples/study.json outage > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: researchos-cid-static
          path: dist/
